name: Assign reviewers

# CODEOWNERS only auto-requests reviews once a pull request is ready for
# review, so draft pull requests get no reviewers. This workflow requests
# them as soon as the pull request is opened, drafts included.

on:
  pull_request_target:
    types: [opened, ready_for_review]

permissions:
  pull-requests: write

jobs:
  request-reviews:
    runs-on: ubuntu-latest
    steps:
      - name: Request reviews from the docs reviewers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          REVIEWERS: billwilkins-hub elliotpercy-commits
        run: |
          set -euo pipefail

          # Skip anyone who is already a requested reviewer or has already
          # reviewed, so re-running never resets an existing approval.
          existing=$(gh pr view "$PR" --repo "$REPO" \
            --json reviewRequests,reviews \
            --jq '([.reviewRequests[].login] + [.reviews[].author.login]) | unique | .[]')

          args=()
          for reviewer in $REVIEWERS; do
            if [ "$reviewer" = "$AUTHOR" ]; then
              echo "Skipping $reviewer: they opened this pull request."
              continue
            fi
            if printf '%s\n' "$existing" | grep -qixF "$reviewer"; then
              echo "Skipping $reviewer: already requested or already reviewed."
              continue
            fi
            args+=(-f "reviewers[]=$reviewer")
          done

          if [ ${#args[@]} -eq 0 ]; then
            echo "Nothing to request."
            exit 0
          fi

          gh api -X POST "repos/$REPO/pulls/$PR/requested_reviewers" "${args[@]}"
